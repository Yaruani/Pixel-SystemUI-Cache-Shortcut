name: Publish signed APK release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (e.g. v0.3.0); must match app/build.gradle"
        required: true
        type: string
        default: v0.3.0

permissions:
  contents: read

jobs:
  signed-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '8.13'
      - name: Validate tag and signing-key configuration
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          APK_KEYSTORE_BASE64: ${{ secrets.APK_KEYSTORE_BASE64 }}
          APK_KEYSTORE_PASSWORD: ${{ secrets.APK_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Invalid tag"; exit 1; }
          version=$(sed -n "s/^[[:space:]]*versionName '\([^']*\)'.*/\1/p" app/build.gradle)
          test "$RELEASE_TAG" = "v$version" || { echo "::error::Tag/version mismatch"; exit 1; }
          if [[ -z "$APK_KEYSTORE_BASE64" || -z "$APK_KEYSTORE_PASSWORD" ]]; then
            echo "::error::First configure APK_KEYSTORE_BASE64 and APK_KEYSTORE_PASSWORD as GitHub Actions repository secrets."
            exit 1
          fi
          echo "Version and signing-key presence validated"
      - name: Configure Android SDK from hosted runner
        run: |
          set -euo pipefail
          test -d "$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1)"
          fi
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;35.0.0"
          test -f "$ANDROID_HOME/platforms/android-36/android.jar"
      - name: Inspect manifest and source
        run: |
          python3 - <<'PY'
          import pathlib, xml.etree.ElementTree as ET
          manifest = ET.parse('app/src/main/AndroidManifest.xml').getroot()
          ns = '{http://schemas.android.com/apk/res/android}'
          assert not [e for e in manifest if e.tag == 'uses-permission']
          app = manifest.find('application')
          assert app is not None
          assert not [e for e in app if e.tag in ('service', 'receiver', 'provider')]
          files = list(pathlib.Path('app/src/main/java').rglob('*.java'))
          assert len(files) == 1
          source = files[0].read_text()
          assert 'TARGET_PACKAGE = "com.android.systemui"' in source
          assert 'APP_STORAGE_ACTION = "com.android.settings.APP_STORAGE_SETTINGS"' in source
          print('PASS: fixed target, zero declared permissions, no background components')
          PY
      - name: Build unsigned release APK
        run: gradle --no-daemon --stacktrace :app:assembleRelease
      - name: Sign and verify release APK
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          APK_KEYSTORE_BASE64: ${{ secrets.APK_KEYSTORE_BASE64 }}
          APK_KEYSTORE_PASSWORD: ${{ secrets.APK_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p dist
          keystore="$RUNNER_TEMP/pixel-systemui-release.p12"
          trap 'rm -f "$keystore"' EXIT
          printf '%s' "$APK_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          unsigned="app/build/outputs/apk/release/app-release-unsigned.apk"
          test -s "$unsigned"
          aligned="$RUNNER_TEMP/app-release-aligned.apk"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f 4 "$unsigned" "$aligned"
          output="dist/Pixel-SystemUI-Cache-Shortcut-$RELEASE_TAG.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$keystore" \
            --ks-type PKCS12 \
            --ks-key-alias pixel-systemui \
            --ks-pass env:APK_KEYSTORE_PASSWORD \
            --key-pass env:APK_KEYSTORE_PASSWORD \
            --out "$output" "$aligned"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$output"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$output" \
            | grep -F "package: name='dev.local.systemuicacheonly'"
          permissions="$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$output")"
          if printf '%s\n' "$permissions" | grep -q uses-permission; then
            echo "::error::Unexpected Android permissions in signed APK"
            exit 1
          fi
          (cd dist && sha256sum "$(basename "$output")" > "$(basename "$output").sha256")
      - name: Create GitHub Release with APK and SHA-256
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          test -s "dist/Pixel-SystemUI-Cache-Shortcut-$RELEASE_TAG.apk"
          gh release create "$RELEASE_TAG" \
            "dist/Pixel-SystemUI-Cache-Shortcut-$RELEASE_TAG.apk" \
            "dist/Pixel-SystemUI-Cache-Shortcut-$RELEASE_TAG.apk.sha256" \
            --target "$GITHUB_SHA" \
            --title "Pixel System UI Cache Shortcut $RELEASE_TAG" \
            --notes-file RELEASE_NOTES.md
