plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.local.systemuicacheonly'
    compileSdk 36

    defaultConfig {
        applicationId 'dev.local.systemuicacheonly'
        minSdk 29
        targetSdk 36
        versionCode 3
        versionName '0.3.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// No AndroidX, third-party dependencies, ads, analytics or network.
